name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  # Both halves of the launcher in one job, on both platforms it ships on. They
  # are together rather than split because they share a checkout and an npm
  # install, and because a Rust change that breaks the front (or the other way
  # round) should turn one leg red rather than two unrelated ones.
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # WebKitGTK and its neighbours are what the Rust host links against on
      # Linux. Windows builds against the WebView2 runtime the image already has.
      - name: Install the Linux host libraries
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            patchelf

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint:ci
      - run: npm run format:check
      - run: npx vitest run

      - name: cargo fmt
        run: cargo fmt --all --check
        working-directory: src-tauri

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: cargo test
        run: cargo test
        working-directory: src-tauri

      - name: cargo build
        run: cargo build
        working-directory: src-tauri

  # Linux only for now. The Windows bundle needs its own installer decisions
  # (WiX or NSIS, and what to do about the existing installer's upgrade path),
  # which is a separate piece of work from proving the host bundles at all.
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install the Linux host libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            patchelf \
            rpm

      - run: npm ci
      - run: npm run build
      # The CLI comes from the @tauri-apps/cli devDependency, so the bundle is
      # built by the same version the lockfile pins rather than by whatever a
      # separate cargo install happened to fetch.
      #
      # NO_STRIP is not an optimisation choice. linuxdeploy ships its own old
      # binutils, and that strip cannot read the .relr.dyn section modern
      # linkers put in the system libraries it copies into the AppDir; it fails
      # the whole AppImage rather than skipping the library. Reproduced on a
      # rolling-release host, where every bundle run died on it. The cost is an
      # AppImage carrying unstripped copies of libraries it was going to carry
      # either way.
      - run: npm run tauri -- build
        env:
          NO_STRIP: true

      - uses: actions/upload-artifact@v4
        with:
          name: riftlauncher-linux-bundles
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb

  # Informational quality scan: never blocks a merge, so a SonarCloud outage or
  # configuration change cannot turn the whole run red.
  sonarcloud:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
