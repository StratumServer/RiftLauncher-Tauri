<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>RiftLauncher</title>
    <!-- The Content-Security-Policy lives in src-tauri/tauri.conf.json (app.security.csp), not in a
         meta tag here. Tauri serves the policy as a header and rewrites it on the way out to add
         the sources its own IPC needs; a second policy in the document would intersect with that
         one and cut the IPC off, so there is exactly one place the policy is written. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="./src/assets/icon.png" type="image/x-icon" />
  </head>

  <body class="font-sans text-zinc-200 bg-zinc-800">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
